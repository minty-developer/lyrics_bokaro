<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가사 뷰어</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" type="image/x-icon" href="./asset/icon/favicon.ico">
</head>

<body>
    <div class="container">
        <header class="site-header">
            <button class="Hamburger" id="HamburgerBtn" aria-label="메뉴 열기">≡</button>
            <h1 class="web-title">Lyrics-ボカロ</h1>
            <div class="header-actions">
                <button class="SettingsBtn" id="SettingsBtn" title="사이트 설정">⚙</button>
                <button class="infoBtn" id="infoBtn" title="사이트 정보">!</button>
            </div>
        </header>
        <div class="page-layout">

        <!-- 좌측 사이드바 (재생목록 및 검색) -->
        <nav class="sidebar" id="Sidebar">
            <div class="sidebar-header">
                <button class="MobileCloseBtn" id="MobileCloseBtn">X</button>
            </div>
            <input type="text" id="search-input" placeholder="곡 제목 또는 아티스트 검색..." autocomplete="off">
            <div class="song-list-tools">
                <label class="sort-control" for="song-sort-select">
                    <span>정렬</span>
                    <select id="song-sort-select" aria-label="곡 목록 정렬">
                        <option value="title">제목순</option>
                        <option value="artist">아티스트순</option>
                        <option value="latest">최신 추가순</option>
                        <option value="oldest">오래된 순</option>
                    </select>
                </label>
                <button type="button" class="feature-button" data-feature="작곡가·작사가 검색">작곡가·작사가 검색</button>
            </div>
            <ul id="song-list">
            </ul>
        </nav>

        <!-- 정중앙 공지 모달 창 -->
        <div class="modal hidden" id="NoticeModal" style="user-select: none;"></div>

        <!-- 정렬 모달 창 -->
        <div id="SortMenu" class="modal hidden" style="z-index: 11000;">
            <div class="modal-content" style="display: flex; flex-direction: column;">
                <div class="modal-header">
                    <h1>정렬 방법</h1>
                    <button id="CloseSortMenuBtn">X</button>
                </div>
                <div class="modal-section">
                    <div style="margin-bottom: 5px;">글자</div>
                    <button onclick="renderListWithSorts('title')">제목</button>
                    <button onclick="renderListWithSorts('artist')">아티스트</button>
                    <div class="modal-divider"></div>
                    <div style="margin-bottom: 5px;">날짜</div>
                    <button onclick="renderListWithSorts('latest');">최신 추가</button>
                    <button onclick="renderListWithSorts('oldest')">과거 추가</button>
                </div>
            </div>
        </div>

        <!-- 정중앙 설정 모달창 -->
        <div class="modal hidden" id="SettingsModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>화면 설정</h2>
                    <button id="CloseSettingsBtn">X</button>
                </div>
                
                <div class="modal-section" id="display-controls">
                    <p class="section-title">가사 표시 옵션</p>
                    <fieldset class="settings-group visibility-group">
                        <legend>표시할 내용</legend>
                        <label class="setting-check"><input type="checkbox" id="toggle-furigana" checked><span>후리가나 보기</span></label>
                        <label class="setting-check"><input type="checkbox" id="toggle-pron" checked><span>발음 보기</span></label>
                        <label class="setting-check"><input type="checkbox" id="toggle-ko" checked><span>한글 해석 보기</span></label>
                    </fieldset>
                    <fieldset class="settings-group">
                        <legend>가사 읽기</legend>
                        <label class="setting-row"><span>줄 간격</span><input data-setting="lineHeight" type="number" min="1" max="3" step="0.1" value="1.8"><small>배</small></label>
                        <label class="setting-row"><span>문단 간격</span><input data-setting="paragraphGap" type="number" min="0" max="120" step="4" value="36"><small>px</small></label>
                        <label class="setting-row"><span>원문 글자 크기</span><input data-setting="fontSize" type="number" min="12" max="48" step="1" value="20"><small>px</small></label>
                        <label class="setting-row"><span>폰트</span><select data-setting="fontFamily"><option value="Kosugi Maru">Kosugi Maru</option><option value="Pretendard">Pretendard</option><option value="sans-serif">시스템 기본</option></select></label>
                        <label class="setting-check"><input data-setting="partSeparation" type="checkbox"><span>파트별 구분</span></label>
                        <label class="setting-row"><span>보컬 필터</span><select data-setting="vocalFilter"><option value="all">모든 보컬</option></select></label>
                        <label class="setting-check"><input data-setting="focusMode" type="checkbox"><span>집중 모드</span></label>
                    </fieldset>
                    <p id="settings-status" class="settings-status" role="status" aria-live="polite"></p>
                </div>
            </div>
        </div>

        <!-- 우측 메인 가사 및 영상 영역 -->
        <main class="lyrics-view">
            <div id="welcome-message">
                <h2>노래를 선택해 주세요</h2>
                <p>왼쪽 리스트에서 듣고 싶은 노래의 가사를 확인하세요.</p>
            </div>

            <div id="lyrics-content" class="hidden">
                <!-- 우측 상단 고정 영상 프레임 -->
                <div id="video-container" class="hidden">
                    <iframe id="video-frame" 
                            src="" 
                            frameborder="0" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                            allowfullscreen>
                    </iframe>
                    <!-- 모바일 유튜브 버튼 (로고만 표시) -->
                    <a id="video-link" class="mobile-video-link" href="" target="_blank" aria-label="YouTube에서 보기">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M21.582 6.186a2.6 2.6 0 0 0-1.838-1.838C18.125 3.9 12 3.9 12 3.9s-6.125 0-7.744.448a2.6 2.6 0 0 0-1.838 1.838C2 7.805 2 12 2 12s0 4.195.448 5.814a2.6 2.6 0 0 0 1.838 1.838C5.875 20.1 12 20.1 12 20.1s6.125 0 7.744-.448a2.6 2.6 0 0 0 1.838-1.838C22 16.195 22 12 22 12s0-4.195-.418-5.814zM9.99 15.47V8.53L16 12l-6.01 3.47z"/>
                        </svg>
                    </a>
                </div>

                <section id="song-information" class="song-information hidden" aria-label="곡 정보">
                    <h3>곡 정보</h3>
                    <dl id="song-information-list"></dl>
                </section>

                <!-- 가사 본문 영역 (중앙 배치) -->
                <div class="lyrics-left-block">
                    <div class="desktop-sticky-header">
                        <h2 id="display-title"></h2>
                        <p id="display-artist"></p>
                        <div class="lyrics-actions">
                            <button type="button" class="feature-button" data-feature="전체 가사 복사">전체 복사</button>
                            <button type="button" class="feature-button" data-feature="선택한 가사 복사">선택 부분 복사</button>
                            <button type="button" class="feature-button" data-feature="특정 가사 링크 공유">가사 구간 공유</button>
                        </div>
                    </div>

                    <div class="lyrics-scroll-body">
                        <div id="lyrics-text"></div>
                        <div class="feature-footer">
                            <button type="button" class="feature-button" data-feature="가사 추가 요청">가사 추가 요청</button>
                            <button type="button" class="feature-button" data-feature="오타 신고">오타 신고</button>
                            <button type="button" class="feature-button" data-feature="번역 수정 제안">번역 수정 제안</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        </div>
        
        <!-- 모바일 백그라운드 오버레이 -->
        <div class="sidebar-overlay hidden" id="SidebarOverlay"></div>
    </div>
    <script src="./javascript/script.js"></script>
</body>

</html>
