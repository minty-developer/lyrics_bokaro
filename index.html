<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가사 뷰어</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <nav class="sidebar">
            <h1>🎵 Playlist</h1>
            <input type="text" id="search-input" placeholder="곡 제목 또는 아티스트 검색...">
            <ul id="song-list">
            </ul>
        </nav>

        <main class="lyrics-view">
            <div id="welcome-message">
                <h2>노래를 선택해 주세요</h2>
                <p>왼쪽 리스트에서 듣고 싶은 노래의 가사를 확인하세요.</p>
            </div>
            <div id="lyrics-content" class="hidden">
                <h2 id="display-title"></h2>
                <p id="display-artist"></p>
                <hr>

                <!-- 추가된 토글 버튼 영역 -->
                <div id="display-controls"
                    style="margin-bottom: 20px; display: flex; gap: 15px; font-size: 0.9em; user-select: none;">
                    <label style="cursor: pointer;"><input type="checkbox" id="toggle-furigana" checked> 후리가나 보기</label>
                    <label style="cursor: pointer;"><input type="checkbox" id="toggle-pron" checked> 발음 보기</label>
                    <label style="cursor: pointer;"><input type="checkbox" id="toggle-ko" checked> 뜻 보기</label>
                </div>

                <div id="lyrics-text"></div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>

</html>
