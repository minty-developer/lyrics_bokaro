name: Notify Release

on:
  release:
    types:
      - published

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Create announcement payload
        env:
          VERSION: ${{ github.event.release.tag_name }}
          CHANGES: ${{ github.event.release.body }}
        run: |
          node - <<'NODE'
          const fs = require("fs");

          const payload = {
            version: process.env.VERSION,
            changes: process.env.CHANGES
          };

          fs.writeFileSync(
            "payload.json",
            JSON.stringify(payload, null, 2),
            "utf8"
          );
          NODE

      - name: Send notice to API
        run: |
          curl -X POST "${{ secrets.BOT_API_URL }}/api/v1/announcement" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${{ secrets.TORI_API_KEY }}" \
            --data-binary @payload.json